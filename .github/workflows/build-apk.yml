name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore shared debug.keystore from Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$HOME/.android/debug.keystore"
            echo "Restored shared debug.keystore ($(wc -c < "$HOME/.android/debug.keystore") bytes)"
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; falling back to runner default debug.keystore"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hako-kodari-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
